{% if user.is_superuser %}

{# ---------- Add modal ---------- #}
<div id="add-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Close add experience form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Close add experience form">×</button>

        <h2 id="add-experience-modal-title">Add a New Experience</h2>
        <form id="project-form" class="project-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="add-title">Title</label>
                <input type="text" id="add-title" name="title" required>
            </div>
            <div class="form-group">
                <label for="add-description">Description</label>
                <textarea id="add-description" name="description" required></textarea>
            </div>
            <div class="form-group">
                <label for="add-category">Category</label>
                <input type="text" id="add-category" name="category" placeholder="e.g. full-time">
            </div>
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Add Experience</button>
            </div>
        </form>
    </div>
</div>

{# ---------- Edit modal ---------- #}
<div id="edit-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-experience-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="edit-experience-modal"
            popovertargetaction="hide"
            aria-label="Close edit experience form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="edit-experience-modal"
                popovertargetaction="hide"
                aria-label="Close edit experience form">×</button>

        <h2 id="edit-experience-modal-title">Edit Experience</h2>
        <form id="edit-experience-form" class="project-form">
            <div class="form-group">
                <label for="edit-title">Title</label>
                <input type="text" id="edit-title" name="title" required>
            </div>
            <div class="form-group">
                <label for="edit-description">Description</label>
                <textarea id="edit-description" name="description" required></textarea>
            </div>
            <div class="form-group">
                <label for="edit-category">Category</label>
                <input type="text" id="edit-category" name="category">
            </div>
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="edit-experience-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Save Changes</button>
            </div>
        </form>
    </div>
</div>

{# ------------- Delete modal ---------------- #}
<div id="delete-experience-modal"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-title">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-experience-modal"
            popovertargetaction="hide"
            aria-label="Close"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-experience-modal"
                popovertargetaction="hide"
                aria-label="Close">×</button>
        <h2 id="delete-experience-title">Delete Experience?</h2>
        <p>Are you sure you want to delete <strong id="delete-experience-name"></strong>?</p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-experience-modal"
                    popovertargetaction="hide">Cancel</button>
            <button type="button" id="confirm-delete-button" class="button button-danger">Yes, delete</button>
        </div>
    </div>
</div>

{% endif %}
