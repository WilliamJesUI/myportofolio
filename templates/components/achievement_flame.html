<form method="post" action="{% url 'main:toggle_flame' achievement.id %}" class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star{% if user in achievement.flamed_by_all %} is-flamed{% endif %}"
            title="{% if achievement.flamed_by.all %}Flamed by {{ achievement.flamed_by.all|join:', '}}{% else %}Be the first to flame{% endif %}">
        <span aria-hidden="true">🔥</span>
        {% if user in achievement.flamed_by.all %}Unflame{% else %}Flame{% endif %}
        <span class="star-count">{{ achievement.flamed_by.count }}</span>
    </button>
</form>
