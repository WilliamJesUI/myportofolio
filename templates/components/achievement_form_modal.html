<div id="add-achievement-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-achievement-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-achievement-modal"
            popovertargetaction="hide"
            aria-label="Close add achievement form"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-achievement-modal"
                popovertargetaction="hide"
                aria-label="Close add achievement form">×</button>

        <h2 id="add-project-modal-title">Add a New Achievement</h2>
        <form id="project-form"
              method="post"
              action="{% url 'main:create_achievement' %}"
              class="project-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-achievement-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button">Add Achievement</button>
            </div>
        </form>
    </div>
</div>

<div id="delete-project-{{ experience.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-project-title-{{ experience.id }}">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-project-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Close"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-project-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Close">×</button>
        <h2 id="delete-project-title-{{ experience.id }}">Delete Experience?</h2>
        <p>
            Are you sure in deleting
            <strong>{{ experience.name }}</strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-project-{{ experience.id }}"
                    popovertargetaction="hide">Cancel</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Yes</button>
            </form>
        </div>
    </div>
</div>
